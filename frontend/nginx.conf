# One origin for the SPA and the API: the API has no CORS and checks Origin/Host.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Docker DNS, re-resolved: nginx starts before the API and survives its restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    # Documents are uploaded through the API: 10 MiB files plus multipart overhead.
    client_max_body_size 11m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location /health/ {
        proxy_pass $api;
        proxy_set_header Host $http_host;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
