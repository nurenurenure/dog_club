info:
    description: 'Этапы 04–06: аккаунты с переключаемыми профилями, члены клуба и собаки. Один активный профиль на сессию, права не объединяются. Access JWT 10 минут, refresh cookie 7 дней, проверка PostgreSQL. Staff регистрирует собак только с уникальным идентификатором; leader читает всех, активный owner — только своих. Неактивное членство закрывает разделы владельца; другие профили и account controls сохраняются. Родители: карточка, внешние сведения у потомка или неизвестный. Проверяются ссылки, пол/возраст и циклы. Изменения версионируются и атомарно сохраняют историю. Титулы не истекают автоматически; исправления требуют причины. JSON до 16 КиБ, RFC 9457, same-origin policy, локальный Mailpit. Ветеринария, племенная работа и файлы документов — последующие этапы.'
    title: Клуб собаководства — backend
    version: 0.6.0
openapi: 3.1.1
