components:
    headers:
        NoStore:
            required: true
            schema:
                const: no-store
                type: string
        RequestID:
            description: Идентификатор запроса, совпадающий с request_id в логах и ошибке
            required: true
            schema:
                minLength: 1
                type: string
    responses:
        AuthBadToken:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Одноразовый код недействителен, использован или просрочен
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        AuthConflict:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Дубликат, несовместимое состояние или попытка отключить последнего администратора
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        AuthForbidden:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Профиль отключён, не выбран для операции, не принадлежит пользователю либо запрещён источник браузерного запроса
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        AuthRateLimited:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Превышен лимит попыток или заняты слоты проверки пароля
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                Retry-After:
                    required: true
                    schema:
                        type: string
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        AuthUnauthorized:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Неверные учётные данные, недействительный JWT или отозванная сессия
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                WWW-Authenticate:
                    required: true
                    schema:
                        type: string
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        AuthUnavailable:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: PostgreSQL или отправка почты недоступны; при отказе почты приглашение сохранено. Location указывает маршрут повторной отправки
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                Location:
                    schema:
                        type: string
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        BadRequest:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Некорректный JSON, неизвестные поля, неверные типы значений либо недействительный одноразовый код активации/восстановления
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        BodyTooLarge:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Превышен допустимый размер тела запроса
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        InternalError:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Внутренняя ошибка, подробности клиенту не раскрываются
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        MemberConflict:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Версия карточки устарела либо адрес используется мероприятием. При ошибке данные и история не меняются.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        MembersUnavailable:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Сервис карточек временно недоступен.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        MethodNotAllowed:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Метод не поддерживается для этого маршрута
            headers:
                Allow:
                    required: true
                    schema:
                        minLength: 1
                        type: string
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        NotFound:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Ресурс или маршрут не найден
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        UnsupportedMediaType:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Ожидается application/json в UTF-8
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        ValidationFailed:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Некорректные значения полей; массив errors может содержать подробности
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
    schemas:
        ActivateInput:
            additionalProperties: false
            properties:
                password:
                    description: Не менее 15 символов, не более 1024 байт UTF-8
                    maxLength: 1024
                    minLength: 15
                    type: string
                    writeOnly: true
                token:
                    maxLength: 43
                    minLength: 43
                    pattern: ^[A-Za-z0-9_-]{43}$
                    type: string
                    writeOnly: true
            required:
                - token
                - password
            type: object
        BindMemberInput:
            additionalProperties: false
            properties:
                member_id:
                    format: int32
                    minimum: 1
                    type: integer
            required:
                - member_id
            type: object
        BlockedInput:
            additionalProperties: false
            properties:
                blocked:
                    type: boolean
            required:
                - blocked
            type: object
        ChangePasswordInput:
            additionalProperties: false
            properties:
                current_password:
                    maxLength: 1024
                    type: string
                    writeOnly: true
                password:
                    description: Не менее 15 символов, не более 1024 байт UTF-8
                    maxLength: 1024
                    minLength: 15
                    type: string
                    writeOnly: true
            required:
                - current_password
                - password
            type: object
        Credentials:
            additionalProperties: false
            properties:
                access_token:
                    type: string
                expires_in:
                    const: 600
                    type: integer
                profile:
                    $ref: '#/components/schemas/Profile'
                token_type:
                    const: Bearer
                    type: string
                user:
                    $ref: '#/components/schemas/User'
            required:
                - access_token
                - token_type
                - expires_in
                - user
                - profile
            type: object
        EnabledInput:
            additionalProperties: false
            properties:
                enabled:
                    type: boolean
            required:
                - enabled
            type: object
        FieldError:
            additionalProperties: false
            properties:
                code:
                    minLength: 1
                    type: string
                field:
                    description: JSON-имя поля, для вложенных полей — запись через точку
                    minLength: 1
                    type: string
                message:
                    description: Безопасное сообщение без переданного пользователем значения
                    minLength: 1
                    type: string
            required:
                - field
                - code
                - message
            type: object
        ForgotInput:
            additionalProperties: false
            properties:
                login:
                    type: string
            required:
                - login
            type: object
        Invitation:
            additionalProperties: false
            properties:
                expires_at:
                    format: date-time
                    type: string
                id:
                    maxLength: 64
                    minLength: 1
                    type: string
                user_id:
                    maxLength: 64
                    minLength: 1
                    type: string
            required:
                - id
                - user_id
                - expires_at
            type: object
        InviteInput:
            additionalProperties: false
            properties:
                club_member_id:
                    minimum: 1
                    type: integer
                email:
                    format: email
                    maxLength: 254
                    type: string
                login:
                    pattern: ^[a-z0-9][a-z0-9._-]{2,63}$
                    type: string
                role:
                    enum:
                        - admin
                        - staff
                        - veterinarian
                        - expert
                        - owner
                        - leader
                    type: string
            required:
                - login
                - email
                - role
            type: object
        Liveness:
            additionalProperties: false
            properties:
                status:
                    const: ok
                    type: string
            required:
                - status
            type: object
        LoginInput:
            additionalProperties: false
            properties:
                login:
                    type: string
                password:
                    maxLength: 1024
                    type: string
                    writeOnly: true
                profile_id:
                    maxLength: 64
                    minLength: 1
                    type: string
            required:
                - login
                - password
            type: object
        Member:
            additionalProperties: false
            properties:
                addresses:
                    items:
                        $ref: '#/components/schemas/MemberAddress'
                    type: array
                contacts:
                    items:
                        $ref: '#/components/schemas/MemberContact'
                    type: array
                date_of_birth:
                    description: Дата YYYY-MM-DD, не позднее текущей даты UTC; null означает отсутствие даты.
                    format: date
                    type:
                        - string
                        - "null"
                full_name:
                    maxLength: 150
                    minLength: 1
                    type: string
                id:
                    format: int32
                    minimum: 1
                    type: integer
                membership_date:
                    description: Дата YYYY-MM-DD, не позднее текущей даты UTC; null означает отсутствие даты.
                    format: date
                    type:
                        - string
                        - "null"
                membership_status:
                    $ref: '#/components/schemas/MemberDictionary'
                version:
                    description: Текущая версия всей карточки. Все изменения карточки, контактов и адресов увеличивают её на один.
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - id
                - full_name
                - date_of_birth
                - membership_date
                - membership_status
                - version
                - contacts
                - addresses
            type: object
        MemberAddress:
            additionalProperties: false
            properties:
                apartment_number:
                    maxLength: 20
                    type: string
                building_number:
                    maxLength: 20
                    type: string
                id:
                    format: int32
                    minimum: 1
                    type: integer
                locality:
                    maxLength: 100
                    minLength: 1
                    type: string
                street:
                    maxLength: 100
                    type: string
                type:
                    $ref: '#/components/schemas/MemberDictionary'
            required:
                - id
                - type
                - locality
                - street
                - building_number
                - apartment_number
            type: object
        MemberAddressInput:
            additionalProperties: false
            properties:
                apartment_number:
                    maxLength: 20
                    type: string
                building_number:
                    maxLength: 20
                    type: string
                locality:
                    maxLength: 100
                    minLength: 1
                    type: string
                street:
                    maxLength: 100
                    type: string
                type_id:
                    format: int32
                    minimum: 1
                    type: integer
                version:
                    description: Текущая версия всей карточки. Все изменения карточки, контактов и адресов увеличивают её на один.
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - version
                - type_id
                - locality
            type: object
        MemberChange:
            additionalProperties: false
            properties:
                action:
                    enum:
                        - member_created
                        - member_updated
                        - contact_saved
                        - contact_deleted
                        - address_saved
                        - address_deleted
                    type: string
                actor_profile_id:
                    type: string
                actor_role:
                    type: string
                actor_user_id:
                    type: string
                after:
                    $ref: '#/components/schemas/Member'
                before:
                    anyOf:
                        - $ref: '#/components/schemas/Member'
                        - type: "null"
                changed_at:
                    format: date-time
                    type: string
                id:
                    format: int64
                    minimum: 1
                    type: integer
                request_id:
                    type: string
            required:
                - id
                - actor_user_id
                - actor_profile_id
                - actor_role
                - action
                - before
                - after
                - request_id
                - changed_at
            type: object
        MemberContact:
            additionalProperties: false
            properties:
                id:
                    format: int32
                    minimum: 1
                    type: integer
                type:
                    $ref: '#/components/schemas/MemberDictionary'
                value:
                    maxLength: 254
                    type: string
            required:
                - id
                - type
                - value
            type: object
        MemberContactInput:
            additionalProperties: false
            properties:
                type_id:
                    format: int32
                    minimum: 1
                    type: integer
                value:
                    description: 'Телефон: 7–15 цифр, до 50 байт с форматированием, без подстановки кода страны. Email: до 254 байт, без имени получателя.'
                    maxLength: 254
                    minLength: 1
                    type: string
                version:
                    description: Текущая версия всей карточки. Все изменения карточки, контактов и адресов увеличивают её на один.
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - version
                - type_id
                - value
            type: object
        MemberCreateInput:
            additionalProperties: false
            properties:
                date_of_birth:
                    description: Дата YYYY-MM-DD, не позднее текущей даты UTC; null означает отсутствие даты.
                    format: date
                    type:
                        - string
                        - "null"
                full_name:
                    maxLength: 150
                    minLength: 1
                    type: string
                membership_date:
                    description: Дата YYYY-MM-DD, не позднее текущей даты UTC; null означает отсутствие даты.
                    format: date
                    type:
                        - string
                        - "null"
                membership_status_id:
                    format: int32
                    minimum: 1
                    type: integer
            required:
                - full_name
                - membership_status_id
            type: object
        MemberDictionaries:
            additionalProperties: false
            properties:
                address_types:
                    items:
                        $ref: '#/components/schemas/MemberDictionary'
                    type: array
                contact_types:
                    items:
                        $ref: '#/components/schemas/MemberDictionary'
                    type: array
                membership_statuses:
                    items:
                        $ref: '#/components/schemas/MemberDictionary'
                    type: array
            required:
                - membership_statuses
                - contact_types
                - address_types
            type: object
        MemberDictionary:
            additionalProperties: false
            properties:
                id:
                    format: int32
                    minimum: 1
                    type: integer
                name:
                    type: string
            required:
                - id
                - name
            type: object
        MemberHistoryPage:
            additionalProperties: false
            properties:
                changes:
                    items:
                        $ref: '#/components/schemas/MemberChange'
                    maxItems: 100
                    type: array
                next_after:
                    format: int64
                    minimum: 1
                    type:
                        - integer
                        - "null"
            required:
                - changes
                - next_after
            type: object
        MemberPage:
            additionalProperties: false
            properties:
                members:
                    items:
                        $ref: '#/components/schemas/MemberSummary'
                    maxItems: 100
                    type: array
                next_after:
                    format: int32
                    minimum: 1
                    type:
                        - integer
                        - "null"
            required:
                - members
                - next_after
            type: object
        MemberPatchInput:
            additionalProperties: false
            description: Передайте хотя бы одно изменяемое поле. Пропущенные поля сохраняются; null очищает только даты. role_id не принимается.
            minProperties: 2
            properties:
                date_of_birth:
                    description: Дата YYYY-MM-DD, не позднее текущей даты UTC; null означает отсутствие даты.
                    format: date
                    type:
                        - string
                        - "null"
                full_name:
                    maxLength: 150
                    minLength: 1
                    type: string
                membership_date:
                    description: Дата YYYY-MM-DD, не позднее текущей даты UTC; null означает отсутствие даты.
                    format: date
                    type:
                        - string
                        - "null"
                membership_status_id:
                    format: int32
                    minimum: 1
                    type: integer
                version:
                    description: Текущая версия всей карточки. Все изменения карточки, контактов и адресов увеличивают её на один.
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - version
            type: object
        MemberSummary:
            additionalProperties: false
            properties:
                date_of_birth:
                    description: Дата YYYY-MM-DD, не позднее текущей даты UTC; null означает отсутствие даты.
                    format: date
                    type:
                        - string
                        - "null"
                full_name:
                    maxLength: 150
                    minLength: 1
                    type: string
                id:
                    format: int32
                    minimum: 1
                    type: integer
                membership_date:
                    description: Дата YYYY-MM-DD, не позднее текущей даты UTC; null означает отсутствие даты.
                    format: date
                    type:
                        - string
                        - "null"
                membership_status:
                    $ref: '#/components/schemas/MemberDictionary'
                version:
                    description: Текущая версия всей карточки. Все изменения карточки, контактов и адресов увеличивают её на один.
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - id
                - full_name
                - date_of_birth
                - membership_date
                - membership_status
                - version
            type: object
        Message:
            additionalProperties: false
            properties:
                message:
                    type: string
            required:
                - message
            type: object
        NotReady:
            additionalProperties: false
            properties:
                status:
                    const: not_ready
                    type: string
            required:
                - status
            type: object
        Principal:
            additionalProperties: false
            properties:
                profile:
                    $ref: '#/components/schemas/Profile'
                user:
                    $ref: '#/components/schemas/User'
            required:
                - user
                - profile
            type: object
        Problem:
            example:
                code: validation_failed
                detail: Проверьте значения полей.
                errors:
                    - code: required
                      field: name
                      message: Укажите имя.
                request_id: example-request-id
                status: 422
                title: Unprocessable Entity
                type: about:blank
            properties:
                code:
                    enum:
                        - invalid_json
                        - body_too_large
                        - unsupported_media_type
                        - validation_failed
                        - not_found
                        - method_not_allowed
                        - internal_error
                        - unauthenticated
                        - forbidden
                        - invalid_token
                        - account_conflict
                        - last_admin
                        - auth_unavailable
                        - mail_unavailable
                        - rate_limited
                        - member_conflict
                        - members_unavailable
                    type: string
                detail:
                    description: Безопасное описание ошибки без внутренних технических деталей
                    type: string
                errors:
                    items:
                        $ref: '#/components/schemas/FieldError'
                    minItems: 1
                    type: array
                request_id:
                    minLength: 1
                    type: string
                status:
                    maximum: 599
                    minimum: 400
                    type: integer
                title:
                    minLength: 1
                    type: string
                type:
                    const: about:blank
                    type: string
            required:
                - type
                - title
                - status
                - code
                - request_id
            type: object
        Profile:
            additionalProperties: false
            properties:
                enabled:
                    type: boolean
                id:
                    maxLength: 64
                    minLength: 1
                    type: string
                role:
                    enum:
                        - admin
                        - staff
                        - veterinarian
                        - expert
                        - owner
                        - leader
                    type: string
            required:
                - id
                - role
                - enabled
            type: object
        Profiles:
            additionalProperties: false
            properties:
                profiles:
                    items:
                        $ref: '#/components/schemas/Profile'
                    type: array
            required:
                - profiles
            type: object
        Readiness:
            additionalProperties: false
            properties:
                status:
                    const: ready
                    type: string
            required:
                - status
            type: object
        RoleInput:
            additionalProperties: false
            properties:
                role:
                    enum:
                        - admin
                        - staff
                        - veterinarian
                        - expert
                        - owner
                        - leader
                    type: string
            required:
                - role
            type: object
        SwitchInput:
            additionalProperties: false
            properties:
                profile_id:
                    maxLength: 64
                    minLength: 1
                    type: string
            required:
                - profile_id
            type: object
        User:
            additionalProperties: false
            properties:
                club_member_id:
                    minimum: 1
                    type: integer
                created_at:
                    format: date-time
                    type: string
                email:
                    format: email
                    type: string
                email_verified_at:
                    format: date-time
                    type: string
                id:
                    maxLength: 64
                    minLength: 1
                    type: string
                login:
                    type: string
                status:
                    enum:
                        - invited
                        - active
                        - blocked
                    type: string
            required:
                - id
                - login
                - email
                - status
                - created_at
            type: object
        Users:
            additionalProperties: false
            properties:
                users:
                    items:
                        $ref: '#/components/schemas/User'
                    maxItems: 100
                    type: array
            required:
                - users
            type: object
    securitySchemes:
        bearerAuth:
            bearerFormat: JWT
            scheme: bearer
            type: http
        refreshCookie:
            in: cookie
            name: dogclub_refresh
            type: apiKey
info:
    description: 'Этапы 04–05: приглашения, аккаунты с переключаемыми профилями и карточки членов клуба. Один активный профиль на сессию, права не объединяются. Access JWT 10 минут; refresh в HttpOnly cookie, абсолютный срок сессии 7 дней, ротация и проверка PostgreSQL. Members: staff редактирует все карточки, leader читает все, owner читает только свою при активном членстве. При неактивном членстве весь раздел владельца закрыт, включая историю и справочники; account controls и другие профили сохраняются. Admin управляет аккаунтами и привязкой к карточке; для ведения карточек нужен staff. club_member.role_id удалён. Все изменения карточек версионируются и сохраняют историю атомарно. JSON auth/members ограничен 16 КиБ. Ошибки RFC 9457; health сохраняет свой JSON DTO. Same-origin browser policy; React позже. Почта только локальная Mailpit.'
    title: Клуб собаководства — backend
    version: 0.5.0
