components:
    headers:
        NoStore:
            required: true
            schema:
                const: no-store
                type: string
        RequestID:
            description: Идентификатор запроса, совпадающий с request_id в логах и ошибке
            required: true
            schema:
                minLength: 1
                type: string
    responses:
        AuthBadToken:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Одноразовый код недействителен, использован или просрочен
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        AuthConflict:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Дубликат, несовместимое состояние или попытка отключить последнего администратора
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        AuthForbidden:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Профиль отключён, не выбран для операции, не принадлежит пользователю либо запрещён источник браузерного запроса
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        AuthRateLimited:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Превышен лимит попыток или заняты слоты проверки пароля
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                Retry-After:
                    required: true
                    schema:
                        type: string
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        AuthUnauthorized:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Неверные учётные данные, недействительный JWT или отозванная сессия
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                WWW-Authenticate:
                    required: true
                    schema:
                        type: string
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        AuthUnavailable:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: PostgreSQL или отправка почты недоступны; при отказе почты приглашение сохранено. Location указывает маршрут повторной отправки
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                Location:
                    schema:
                        type: string
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        BadRequest:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Некорректный JSON, неизвестные поля, неверные типы значений либо недействительный одноразовый код активации/восстановления
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        BodyTooLarge:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Превышен допустимый размер тела запроса
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        DogConflict:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Устаревшая версия, повторный глобальный идентификатор или уже записанный титул; транзакция откатывается целиком.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        DogsUnavailable:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Сервис учёта собак временно недоступен.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        InternalError:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Внутренняя ошибка, подробности клиенту не раскрываются
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        MemberConflict:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Версия карточки устарела либо адрес используется мероприятием. При ошибке данные и история не меняются.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        MembersUnavailable:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Сервис карточек временно недоступен.
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        MethodNotAllowed:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Метод не поддерживается для этого маршрута
            headers:
                Allow:
                    required: true
                    schema:
                        minLength: 1
                        type: string
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        NotFound:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Ресурс или маршрут не найден
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        UnsupportedMediaType:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Ожидается application/json в UTF-8
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
        ValidationFailed:
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
            description: Некорректные значения полей; массив errors может содержать подробности
            headers:
                Cache-Control:
                    $ref: '#/components/headers/NoStore'
                X-Request-ID:
                    $ref: '#/components/headers/RequestID'
    schemas:
        ActivateInput:
            additionalProperties: false
            properties:
                password:
                    description: Не менее 15 символов, не более 1024 байт UTF-8
                    maxLength: 1024
                    minLength: 15
                    type: string
                    writeOnly: true
                token:
                    maxLength: 43
                    minLength: 43
                    pattern: ^[A-Za-z0-9_-]{43}$
                    type: string
                    writeOnly: true
            required:
                - token
                - password
            type: object
        BindMemberInput:
            additionalProperties: false
            properties:
                member_id:
                    format: int32
                    minimum: 1
                    type: integer
            required:
                - member_id
            type: object
        BlockedInput:
            additionalProperties: false
            properties:
                blocked:
                    type: boolean
            required:
                - blocked
            type: object
        ChangePasswordInput:
            additionalProperties: false
            properties:
                current_password:
                    maxLength: 1024
                    type: string
                    writeOnly: true
                password:
                    description: Не менее 15 символов, не более 1024 байт UTF-8
                    maxLength: 1024
                    minLength: 15
                    type: string
                    writeOnly: true
            required:
                - current_password
                - password
            type: object
        Credentials:
            additionalProperties: false
            properties:
                access_token:
                    type: string
                expires_in:
                    const: 600
                    type: integer
                profile:
                    $ref: '#/components/schemas/Profile'
                token_type:
                    const: Bearer
                    type: string
                user:
                    $ref: '#/components/schemas/User'
            required:
                - access_token
                - token_type
                - expires_in
                - user
                - profile
            type: object
        Dog:
            additionalProperties: false
            properties:
                breed:
                    $ref: '#/components/schemas/DogDictionary'
                coat_color:
                    $ref: '#/components/schemas/DogDictionary'
                date_of_birth:
                    format: date
                    type: string
                height_cm:
                    maximum: 99999.99
                    minimum: 0.01
                    multipleOf: 0.01
                    type:
                        - number
                        - "null"
                id:
                    format: int32
                    minimum: 1
                    type: integer
                identifier:
                    $ref: '#/components/schemas/DogIdentifier'
                nickname:
                    maxLength: 100
                    minLength: 1
                    type: string
                owner_ids:
                    items:
                        format: int32
                        minimum: 1
                        type: integer
                    maxItems: 100
                    minItems: 1
                    type: array
                    uniqueItems: true
                pedigree:
                    $ref: '#/components/schemas/DogPedigree'
                sex:
                    $ref: '#/components/schemas/DogDictionary'
                status:
                    $ref: '#/components/schemas/DogDictionary'
                titles:
                    items:
                        $ref: '#/components/schemas/DogTitle'
                    type: array
                version:
                    description: Последняя версия всей карточки собаки; обязательна для каждой мутации.
                    format: int64
                    minimum: 1
                    type: integer
                weight_kg:
                    maximum: 99999.99
                    minimum: 0.01
                    multipleOf: 0.01
                    type:
                        - number
                        - "null"
            required:
                - id
                - nickname
                - date_of_birth
                - identifier
                - status
                - breed
                - coat_color
                - sex
                - height_cm
                - weight_kg
                - version
                - owner_ids
                - pedigree
                - titles
            type: object
        DogChange:
            additionalProperties: false
            properties:
                action:
                    enum:
                        - dog_created
                        - dog_updated
                        - owners_updated
                        - pedigree_updated
                        - title_recorded
                        - title_corrected
                        - title_record_corrected
                    type: string
                actor_profile_id:
                    type: string
                actor_role:
                    type: string
                actor_user_id:
                    type: string
                after:
                    $ref: '#/components/schemas/Dog'
                before:
                    anyOf:
                        - $ref: '#/components/schemas/Dog'
                        - type: "null"
                changed_at:
                    format: date-time
                    type: string
                id:
                    format: int64
                    minimum: 1
                    type: integer
                reason:
                    maxLength: 500
                    type: string
                request_id:
                    type: string
            required:
                - id
                - actor_user_id
                - actor_profile_id
                - actor_role
                - action
                - reason
                - before
                - after
                - request_id
                - changed_at
            type: object
        DogCorrectionInput:
            additionalProperties: false
            properties:
                reason:
                    maxLength: 500
                    minLength: 1
                    type: string
                version:
                    description: Последняя версия всей карточки собаки; обязательна для каждой мутации.
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - version
                - reason
            type: object
        DogCreateInput:
            additionalProperties: false
            properties:
                breed_id:
                    format: int32
                    minimum: 1
                    type: integer
                coat_color_id:
                    format: int32
                    minimum: 1
                    type: integer
                date_of_birth:
                    format: date
                    type: string
                height_cm:
                    maximum: 99999.99
                    minimum: 0.01
                    multipleOf: 0.01
                    type:
                        - number
                        - "null"
                identifier:
                    $ref: '#/components/schemas/DogIdentifierInput'
                nickname:
                    maxLength: 100
                    minLength: 1
                    type: string
                owner_ids:
                    items:
                        format: int32
                        minimum: 1
                        type: integer
                    maxItems: 100
                    minItems: 1
                    type: array
                    uniqueItems: true
                sex_id:
                    format: int32
                    minimum: 1
                    type: integer
                status_id:
                    format: int32
                    minimum: 1
                    type: integer
                weight_kg:
                    maximum: 99999.99
                    minimum: 0.01
                    multipleOf: 0.01
                    type:
                        - number
                        - "null"
            required:
                - nickname
                - date_of_birth
                - identifier
                - status_id
                - breed_id
                - coat_color_id
                - sex_id
                - owner_ids
            type: object
        DogDictionaries:
            additionalProperties: false
            properties:
                breeds:
                    items:
                        $ref: '#/components/schemas/DogDictionary'
                    type: array
                coat_colors:
                    items:
                        $ref: '#/components/schemas/DogDictionary'
                    type: array
                identifier_types:
                    items:
                        $ref: '#/components/schemas/DogDictionary'
                    type: array
                sexes:
                    items:
                        $ref: '#/components/schemas/DogDictionary'
                    type: array
                statuses:
                    items:
                        $ref: '#/components/schemas/DogDictionary'
                    type: array
                titles:
                    items:
                        $ref: '#/components/schemas/DogDictionary'
                    type: array
            required:
                - statuses
                - breeds
                - coat_colors
                - sexes
                - identifier_types
                - titles
            type: object
        DogDictionary:
            additionalProperties: false
            properties:
                id:
                    format: int32
                    minimum: 1
                    type: integer
                name:
                    type: string
            required:
                - id
                - name
            type: object
        DogExternalParent:
            additionalProperties: false
            properties:
                issuer:
                    maxLength: 150
                    type: string
                nickname:
                    maxLength: 100
                    type: string
                pedigree_number:
                    maxLength: 100
                    type: string
            required:
                - nickname
                - pedigree_number
                - issuer
            type: object
        DogExternalParentInput:
            additionalProperties: false
            anyOf:
                - properties:
                    nickname:
                        minLength: 1
                        type: string
                  required:
                    - nickname
                - properties:
                    pedigree_number:
                        minLength: 1
                        type: string
                  required:
                    - pedigree_number
            properties:
                issuer:
                    maxLength: 150
                    type: string
                nickname:
                    maxLength: 100
                    type: string
                pedigree_number:
                    maxLength: 100
                    type: string
            required: []
            type: object
        DogHistoryPage:
            additionalProperties: false
            properties:
                changes:
                    items:
                        $ref: '#/components/schemas/DogChange'
                    maxItems: 100
                    type: array
                next_after:
                    format: int64
                    minimum: 1
                    type:
                        - integer
                        - "null"
            required:
                - changes
                - next_after
            type: object
        DogIdentifier:
            additionalProperties: false
            properties:
                date:
                    format: date
                    type:
                        - string
                        - "null"
                number:
                    maxLength: 100
                    minLength: 1
                    type: string
                type:
                    $ref: '#/components/schemas/DogDictionary'
            required:
                - type
                - number
                - date
            type: object
        DogIdentifierInput:
            additionalProperties: false
            properties:
                date:
                    format: date
                    type:
                        - string
                        - "null"
                number:
                    description: 'Строка: ведущие нули сохраняются. Краевые пробелы удаляются; уникальность глобальная и регистрозависимая.'
                    maxLength: 100
                    minLength: 1
                    type: string
                type_id:
                    format: int32
                    minimum: 1
                    type: integer
            required:
                - type_id
                - number
            type: object
        DogOwnersInput:
            additionalProperties: false
            properties:
                owner_ids:
                    items:
                        format: int32
                        minimum: 1
                        type: integer
                    maxItems: 100
                    minItems: 1
                    type: array
                    uniqueItems: true
                version:
                    description: Последняя версия всей карточки собаки; обязательна для каждой мутации.
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - version
                - owner_ids
            type: object
        DogPage:
            additionalProperties: false
            properties:
                dogs:
                    items:
                        $ref: '#/components/schemas/DogSummary'
                    maxItems: 100
                    type: array
                next_after:
                    format: int32
                    minimum: 1
                    type:
                        - integer
                        - "null"
            required:
                - dogs
                - next_after
            type: object
        DogParent:
            additionalProperties: false
            properties:
                dog:
                    anyOf:
                        - $ref: '#/components/schemas/DogRelative'
                        - type: "null"
                dog_id:
                    format: int32
                    minimum: 1
                    type:
                        - integer
                        - "null"
                external:
                    anyOf:
                        - $ref: '#/components/schemas/DogExternalParent'
                        - type: "null"
            required:
                - dog_id
                - dog
                - external
            type: object
        DogParentInput:
            additionalProperties: false
            oneOf:
                - properties:
                    dog_id:
                        format: int32
                        minimum: 1
                        type: integer
                    external:
                        type: "null"
                  required:
                    - dog_id
                - properties:
                    dog_id:
                        type: "null"
                    external:
                        $ref: '#/components/schemas/DogExternalParentInput'
                  required:
                    - external
            properties:
                dog_id:
                    format: int32
                    minimum: 1
                    type:
                        - integer
                        - "null"
                external:
                    anyOf:
                        - $ref: '#/components/schemas/DogExternalParentInput'
                        - type: "null"
            required: []
            type: object
        DogPatchInput:
            additionalProperties: false
            description: Изменяется хотя бы одно поле. Пропуск сохраняет значение; null разрешён только для height_cm/weight_kg. identifier заменяется целиком, date внутри него может быть null. Владельцы и родословная меняются отдельными маршрутами.
            minProperties: 2
            properties:
                breed_id:
                    format: int32
                    minimum: 1
                    type: integer
                coat_color_id:
                    format: int32
                    minimum: 1
                    type: integer
                date_of_birth:
                    format: date
                    type: string
                height_cm:
                    maximum: 99999.99
                    minimum: 0.01
                    multipleOf: 0.01
                    type:
                        - number
                        - "null"
                identifier:
                    $ref: '#/components/schemas/DogIdentifierInput'
                nickname:
                    maxLength: 100
                    minLength: 1
                    type: string
                sex_id:
                    format: int32
                    minimum: 1
                    type: integer
                status_id:
                    format: int32
                    minimum: 1
                    type: integer
                version:
                    description: Последняя версия всей карточки собаки; обязательна для каждой мутации.
                    format: int64
                    minimum: 1
                    type: integer
                weight_kg:
                    maximum: 99999.99
                    minimum: 0.01
                    multipleOf: 0.01
                    type:
                        - number
                        - "null"
            required:
                - version
            type: object
        DogPedigree:
            additionalProperties: false
            properties:
                father:
                    anyOf:
                        - $ref: '#/components/schemas/DogParent'
                        - type: "null"
                issuer:
                    maxLength: 150
                    type: string
                mother:
                    anyOf:
                        - $ref: '#/components/schemas/DogParent'
                        - type: "null"
                number:
                    maxLength: 100
                    type: string
            required:
                - number
                - issuer
                - mother
                - father
            type: object
        DogPedigreeInput:
            additionalProperties: false
            properties:
                father:
                    anyOf:
                        - $ref: '#/components/schemas/DogParentInput'
                        - type: "null"
                issuer:
                    maxLength: 150
                    type: string
                mother:
                    anyOf:
                        - $ref: '#/components/schemas/DogParentInput'
                        - type: "null"
                number:
                    maxLength: 100
                    type: string
                version:
                    description: Последняя версия всей карточки собаки; обязательна для каждой мутации.
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - version
            type: object
        DogRelative:
            additionalProperties: false
            properties:
                breed:
                    $ref: '#/components/schemas/DogDictionary'
                date_of_birth:
                    format: date
                    type: string
                id:
                    format: int32
                    minimum: 1
                    type: integer
                nickname:
                    type: string
                pedigree_issuer:
                    type: string
                pedigree_number:
                    type: string
                sex:
                    $ref: '#/components/schemas/DogDictionary'
            required:
                - id
                - nickname
                - date_of_birth
                - sex
                - breed
                - pedigree_number
                - pedigree_issuer
            type: object
        DogSummary:
            additionalProperties: false
            properties:
                breed:
                    $ref: '#/components/schemas/DogDictionary'
                coat_color:
                    $ref: '#/components/schemas/DogDictionary'
                date_of_birth:
                    format: date
                    type: string
                height_cm:
                    maximum: 99999.99
                    minimum: 0.01
                    multipleOf: 0.01
                    type:
                        - number
                        - "null"
                id:
                    format: int32
                    minimum: 1
                    type: integer
                identifier:
                    $ref: '#/components/schemas/DogIdentifier'
                nickname:
                    maxLength: 100
                    minLength: 1
                    type: string
                sex:
                    $ref: '#/components/schemas/DogDictionary'
                status:
                    $ref: '#/components/schemas/DogDictionary'
                version:
                    description: Последняя версия всей карточки собаки; обязательна для каждой мутации.
                    format: int64
                    minimum: 1
                    type: integer
                weight_kg:
                    maximum: 99999.99
                    minimum: 0.01
                    multipleOf: 0.01
                    type:
                        - number
                        - "null"
            required:
                - id
                - nickname
                - date_of_birth
                - identifier
                - status
                - breed
                - coat_color
                - sex
                - height_cm
                - weight_kg
                - version
            type: object
        DogTitle:
            additionalProperties: false
            properties:
                awarded_on:
                    format: date
                    type:
                        - string
                        - "null"
                basis:
                    maxLength: 1000
                    type: string
                type:
                    $ref: '#/components/schemas/DogDictionary'
            required:
                - type
                - awarded_on
                - basis
            type: object
        DogTitleInput:
            additionalProperties: false
            properties:
                awarded_on:
                    format: date
                    type:
                        - string
                        - "null"
                basis:
                    maxLength: 1000
                    type: string
                title_id:
                    format: int32
                    minimum: 1
                    type: integer
                version:
                    description: Последняя версия всей карточки собаки; обязательна для каждой мутации.
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - version
                - title_id
            type: object
        DogTitleUpdateInput:
            additionalProperties: false
            properties:
                awarded_on:
                    format: date
                    type:
                        - string
                        - "null"
                basis:
                    maxLength: 1000
                    type: string
                reason:
                    maxLength: 500
                    minLength: 1
                    type: string
                version:
                    description: Последняя версия всей карточки собаки; обязательна для каждой мутации.
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - version
                - reason
            type: object
        EnabledInput:
            additionalProperties: false
            properties:
                enabled:
                    type: boolean
            required:
                - enabled
            type: object
        FieldError:
            additionalProperties: false
            properties:
                code:
                    minLength: 1
                    type: string
                field:
